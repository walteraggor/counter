<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <div class="container">
            <h1>Counter</h1>
            <!-- aria-live makes a screen reader read the number out whenever it changes -->
            <span id="value" aria-live="polite">0</span>
            <div class="button-container">
                <button type="button" class="btn decrease">decrease</button>
                <button type="button" class="btn reset">reset</button>
                <button type="button" class="btn increase">increase</button>
            </div>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
